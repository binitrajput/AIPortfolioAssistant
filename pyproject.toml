[project]
name = "ai-portfolio"
version = "0.1.0"
description = "A React portfolio with a FastAPI-powered AI assistant."
readme = "README.md"
authors = [
    { name = "binitrajput", email = "binitrajput5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
